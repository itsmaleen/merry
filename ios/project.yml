name: cmux
options:
  bundleIdPrefix: ai.manaflow
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  cmux:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - cmux
    info:
      path: cmux/Info.plist
      properties:
        CFBundleDisplayName: cmux
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - cmux-bridge
            CFBundleURLName: ai.manaflow.cmux-bridge
        NSCameraUsageDescription: "Used to scan the QR code displayed by cmux-bridge for pairing."
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.manaflow.cmux
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
