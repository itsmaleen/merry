name: merry
options:
  bundleIdPrefix: dev.itsmaleen
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  merry:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - merry
    info:
      path: merry/Info.plist
      properties:
        CFBundleDisplayName: merry
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - merry-bridge
            CFBundleURLName: dev.itsmaleen.merry-bridge
        NSCameraUsageDescription: "Used to scan the pairing QR code shown by the bridge on your Mac."
        NSLocalNetworkUsageDescription: "Used to discover and connect to the bridge running on your Mac over the local network."
        NSBonjourServices:
          - _merry-bridge._tcp
        NSMicrophoneUsageDescription: "Used for voice input to send text to your terminal sessions."
        NSSpeechRecognitionUsageDescription: "Used to transcribe your voice and send it as text."
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.itsmaleen.merry
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
